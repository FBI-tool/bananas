---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Install OS packages
        run: |
          sudo apt update && \
          sudo apt-get install -y flatpak flatpak-builder libx11-dev libxfixes-dev libxext-dev libxrandr-dev libwayland-dev wayland-protocols unzip && \
          sudo snap install snapcraft --classic && \
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: true
          export_path: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux
        run: make linux
        env:
          VERSION: ${{ env.VERSION }}
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/p2p-kiwi_amd64.deb
            dist/p2p-kiwi_amd64.snap
            dist/p2p-kiwi_x86_64.AppImage
            dist/p2p-kiwi_x86_64.flatpak
          if-no-files-found: error
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Install OS packages
        run: |
          sudo apt update && \
          sudo apt-get install -y flatpak flatpak-builder && \
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: true
          export_path: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux ARM64
        run: make linux-arm64
        env:
          VERSION: ${{ env.VERSION }}
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/p2p-kiwi_arm64.deb
            dist/p2p-kiwi_arm64.AppImage
            dist/p2p-kiwi_aarch64.flatpak
          if-no-files-found: error
