---
appId: kiwi.p2p.desktop
productName: p2p.kiwi
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.ts'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: native/overlay-sidecar/dist
    to: sidecar
    filter:
      - p2p-kiwi-sidecar
      - p2p-kiwi-sidecar.exe
  - from: build/udev/70-p2p-kiwi-input.rules
    to: udev/70-p2p-kiwi-input.rules
win:
  executableName: p2p-kiwi
  icon: build/icon.ico
nsis:
  include: build/installer.nsh
  artifactName: p2p-kiwi-setup_${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  notarize: false
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: p2p-kiwi_${arch}.${ext}
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - snap
    - flatpak
    - deb
  maintainer: p2p.kiwi
  category: Utility
  icon: build/
protocols:
  name: p2p.kiwi
  schemes:
    - kiwi
appImage:
  artifactName: p2p-kiwi_${arch}.${ext}
snap:
  artifactName: p2p-kiwi_${arch}.${ext}
flatpak:
  artifactName: p2p-kiwi_${arch}.${ext}
deb:
  artifactName: p2p-kiwi_${arch}.${ext}
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
npmRebuild: false
afterPack: scripts/after-pack-macos.cjs
afterSign: scripts/after-sign-macos.cjs
publish:
  provider: generic
  url: https://p2p.kiwi/auto-updates/
